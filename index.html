<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#000000"><meta name="format-detection" content="telephone=no">
<title>Baccarat Dealer Training</title>
<style>
:root{--felt:#0b3d2a;--gold:#d4a62a;--ink:#f4efe0;--bg:#07140e;--red:#e23a3a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
html{height:100%;margin:0;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;margin:0;background:var(--bg);color:var(--ink);font:11px system-ui,sans-serif;overflow:hidden}
/* portrait: tự xoay giao diện 90° (không chặn, không cần xoay máy) */
@media (orientation:portrait){body{width:100vh;width:100dvh;height:100vw;height:100dvw;transform-origin:0 0;transform:rotate(90deg) translateY(-100%)}}
#note{position:fixed;left:50%;top:44px;transform:translateX(-50%);z-index:70;background:#000c;color:#ffd54a;padding:5px 14px;border-radius:14px;font-size:14px;font-weight:700;pointer-events:none;display:none;white-space:nowrap}
#dbg{position:fixed;left:0;right:0;bottom:0;z-index:200;background:#a00;color:#fff;font-size:10px;padding:2px 6px;display:none}
#app{display:flex;flex-direction:column;height:100%;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
#top{display:flex;gap:4px;align-items:center;padding:3px 6px;background:#000;border-bottom:1px solid var(--gold);overflow-x:auto;white-space:nowrap;flex:none}
#top .st{color:var(--gold);font-weight:700;margin-right:4px}
button{font:inherit;font-size:10px;font-weight:600;color:var(--ink);background:#1b2e24;border:1px solid var(--gold);border-radius:4px;padding:4px 7px;flex:none}
button:active{background:var(--gold);color:#000}
#main{flex:1;display:flex;min-height:0;background:radial-gradient(ellipse at 50% 0,#14573c,var(--felt))}
#aye{width:74px;flex:none;border-right:1px solid #0006;display:flex;flex-direction:column;align-items:center;gap:5px;padding:5px;justify-content:center}
#shoe{width:56px;height:70px;border-radius:6px;background:linear-gradient(#222,#555);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;color:var(--gold);font-size:10px}
#drawn{width:34px;height:48px}
#center{flex:1;display:flex;flex-direction:column;min-width:0;padding:3px;gap:3px}
.row{display:flex;gap:3px;min-height:0}
.zone{position:relative;border:1px solid var(--gold);border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;text-align:center;line-height:1.05;font-size:9px;min-width:0;flex:1}
.zone.p{color:var(--red)}.zone.b{color:#fff}.zone.s{color:#fff;font-weight:600}
.zone.hot{background:#ffffff26;outline:2px solid #fff}
.seat{flex:1;display:flex;flex-direction:column;gap:2px;position:relative;min-width:0}
.seat i{position:absolute;top:-2px;left:3px;font-style:normal;color:#fff;font-size:9px;z-index:2;background:var(--felt);padding:0 3px;border-radius:3px}
#seats{flex:none;height:21%}#sides{flex:none;height:21%}
#seats .zone{flex:1}
.ins{flex:.8;color:#ffd}
.chip{width:var(--s,30px);height:var(--s,30px);border-radius:50%;border:3px dashed #fff9;box-shadow:inset 0 0 0 2px var(--c),0 1px 3px #000;background:var(--c);color:var(--t,#fff);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:8px;flex:none}
.bet{position:absolute;bottom:1px;right:1px;display:flex;align-items:center;gap:2px;font-size:8px;font-weight:700;pointer-events:none;background:#000a;border-radius:10px;padding:0 3px 0 0}
.bet .chip{--s:16px;font-size:0;border-width:2px}
#work{flex:1;display:flex;gap:4px;min-height:0;background:#0006;border:1px dashed #d4a62a99;border-radius:6px;padding:3px}
#cards{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;flex:1.6}
#cards .slot{border:1px dashed #fff5;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:8px;color:#fff8;position:relative}
#cards .slot.h{background:#d4a62a55;border:2px solid var(--gold);color:#fff}
.slot.r{grid-column:span 1}
.card{width:80%;height:88%;max-width:34px;border-radius:3px;background:repeating-linear-gradient(45deg,#8c1c1c,#8c1c1c 3px,#aa2a2a 3px,#aa2a2a 6px);border:1.5px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px}
.card.up{background:#fff;color:#111}.card.land{transform:rotate(90deg)}
#tray{flex:1;border:1px solid #fff4;border-radius:5px;padding:3px;display:flex;flex-direction:column;gap:2px;min-width:70px}
#tray .tt{font-size:9px;color:var(--gold)}
#trayChips{display:flex;flex-wrap:wrap;gap:1px;align-content:flex-start;overflow:hidden;flex:1;touch-action:none}
#trayChips .chip{--s:17px;font-size:0;border-width:2px}
#bank{flex:none;display:flex;flex-direction:row-reverse;justify-content:center;gap:5px;padding:3px 6px 4px;background:#000;border-top:1px solid var(--gold)}
#bank .chip{--s:36px;font-size:10px}
#bank>div{text-align:center;font-size:8px;color:#bbb}
#menu{position:fixed;z-index:20;background:#000e;border:1px solid var(--gold);border-radius:6px;padding:5px;display:none;flex-direction:column;gap:4px}
#toast{position:fixed;left:50%;top:40px;transform:translateX(-50%);background:#000e;border:1px solid var(--gold);padding:5px 10px;border-radius:5px;z-index:30;display:none}
#ghost{position:fixed;z-index:40;pointer-events:none;display:none;background:#000c;border:1px solid var(--gold);border-radius:12px;padding:2px 8px;font-weight:700}
#cardAct{position:fixed;z-index:20;display:none;gap:4px;background:#000e;padding:5px;border:1px solid var(--gold);border-radius:6px}
#main{background:#122f80}
.zone{border-color:#e8a21a}
#table{flex:1;display:flex;gap:3px;min-height:0}
.wing{display:flex;gap:2px;flex:none;width:22%}
.col{flex:1;display:flex}.col .zone{flex:1}
.eg{flex:3;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:2px}
#mid{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.tr{display:flex;gap:2px;flex:1;min-height:0}.tr.big{flex:2.6}
.seat .zone{font-size:8px}
#table .zone{font-size:6px;border-radius:3px;padding:0}
#table .zone.p,#table .zone.dr{color:#ff3b3b}#table .zone.b,#table .zone.tg{color:#fff}#table .zone.y{color:#ffd400}
.v{writing-mode:vertical-rl;font-size:8px!important}
.logo{flex:1.2;display:flex;align-items:center;justify-content:center;color:#e8a21a;font:italic 700 10px serif}
#work{flex:none;flex-direction:column;gap:3px}
#cards{flex:none;height:54px;grid-template-columns:repeat(7,1fr)!important}
.slot[data-slot="5"]{order:1}.slot[data-slot="3"]{order:2}.slot[data-slot="2"]{order:3}#six{order:4}.slot[data-slot="1"]{order:5}.slot[data-slot="0"]{order:6}.slot[data-slot="4"]{order:7}
#six{border:1.5px solid #e8a21a;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:8px;font-weight:800;color:#ffd400;margin:auto;width:40px;height:40px}
#six::before{content:'WIN\A ON 6';white-space:pre}#six.on{background:#ffd400;color:#000}
#tray{flex:none;height:32px;flex-direction:row;align-items:center;min-width:0}#tray .tt{white-space:nowrap}
#res{position:fixed;inset:0;z-index:50;background:#000b;display:none;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--gold)}
#res button{font-size:14px;padding:10px 18px}
#ex{position:fixed;top:32px;left:80px;z-index:15;background:#000e;border:1px solid var(--gold);border-radius:6px;padding:4px;display:none;max-width:270px;font-size:9px;color:var(--gold)}
#ex .exc{display:flex;flex-wrap:wrap;gap:1px;margin:3px 0}#ex .chip{--s:16px;font-size:0;border-width:2px}#ex .ex{height:36px;width:130px}
.chip{position:relative}.badge{position:absolute;right:-4px;bottom:-4px;background:#000;color:#fff;font-size:7px;font-weight:800;border-radius:6px;padding:0 2px;line-height:1.2}
.pile{position:absolute;top:1px;left:1px;display:flex;gap:2px;background:#000a;border-radius:8px;padding:1px 3px;pointer-events:none}.pile .chip{--s:13px;font-size:0;border-width:1.5px}
input{-webkit-user-select:text;user-select:text;touch-action:auto}
#tray button{margin-left:auto}
button{font-size:12px;padding:8px 11px;min-height:34px}
#top{padding:4px 6px;gap:6px}
#flow{font-size:13px;padding:8px 14px;background:#6b4f00}
#tray button{min-height:26px;padding:4px 8px}
#aye{width:100px;justify-content:flex-start;overflow-y:auto;gap:3px;padding:3px}
#shoe{width:50px;height:54px;flex:none;margin-top:auto}#drawn{min-height:50px;width:34px}
#sb{width:100%;text-align:center;font-weight:800;font-size:10px;border-radius:4px;padding:5px 2px;color:#fff;line-height:1.1;background:#666}
#tm{font:700 14px monospace;color:#fff}
#hist{display:grid;grid-template-columns:1fr 1fr;gap:1px 3px;width:100%;font-size:8px;font-weight:700}
#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:80;min-width:55%;max-width:90%;background:#111;border:2px solid var(--gold);border-radius:10px;padding:16px 20px;font-size:17px;text-align:center;display:none;flex-direction:column;gap:12px;align-items:center;box-shadow:0 0 0 100vmax #0008;color:#fff}
#toast button{font-size:16px;padding:10px 28px}
#exs{position:fixed;top:48px;left:110px;right:8px;z-index:15;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.exp{pointer-events:auto;background:#000e;border:2px solid #e08a1e;border-radius:8px;padding:8px;color:#ffb35a;font-size:12px;font-weight:700;min-width:210px;max-width:260px}
.exp .exc{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}.exp .chip{--s:28px;font-size:0;border-width:2px}.exp .badge{font-size:10px}.exp .zone{height:56px;font-size:11px;color:#fff;width:100%}
#shoe{margin-top:0!important}#hist{margin-top:auto}
.blink{animation:bk .7s infinite alternate}@keyframes bk{to{background:#ffd40066}}

/* ===== v9: mobile — không scroll/zoom, chỉ chạm được phần tử cần chạm ===== */
:root{--u:3.9px}
html,body{touch-action:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overscroll-behavior:none}
img,svg{-webkit-user-drag:none}
#top,#aye{scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior:contain}
#top::-webkit-scrollbar,#aye::-webkit-scrollbar{display:none}
button{cursor:pointer;outline:none;font-size:clamp(10px,calc(var(--u)*3),13px);min-height:clamp(28px,calc(var(--u)*8),38px);padding:0 clamp(6px,calc(var(--u)*2.2),12px);white-space:nowrap}
#top{gap:5px;padding:3px 8px}
#flow{padding:0 clamp(10px,calc(var(--u)*3.6),16px)}
#top .st{pointer-events:none}
/* chỉ phần tử tương tác mới nhận chạm */
#sb,#tm,#hist,#drawn,.logo,.seat>i,#tray .tt,#note,#ghost,.bet,.pile,#bank .chip *,#cards .slot:empty:not(.h),.exp>div:not([data-zone]),#ov>div{pointer-events:none}
.zone[data-zone]:active{filter:brightness(1.45)}
#shoe:active,#cards .slot.h:active,#six:active{filter:brightness(1.35)}
#bank>div:active .chip{transform:scale(.9)}
/* kích thước theo màn hình */
#bank .chip{--s:clamp(30px,calc(var(--u)*9.5),44px)}
#bank{gap:clamp(4px,calc(var(--u)*1.4),8px)}
#tray{height:40px}#trayChips .chip{--s:24px}
#table .zone{font-size:clamp(6px,calc(var(--u)*1.8),10px)}
.v{font-size:clamp(7px,calc(var(--u)*2),9px)!important}
#cardAct button,#menu button{min-height:40px;padding:0 16px;font-size:13px}
#ov button{min-height:40px;padding:0 16px;font-size:15px}
#ov button,#ov input,#ov .chip{pointer-events:auto}
#tbg{position:fixed;inset:0;z-index:79;background:transparent;display:none}
@media (orientation:portrait){#app{padding:env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0) env(safe-area-inset-top,0)}}
#table{position:relative;flex:1;min-height:0;display:block}
#tsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#tsvg path{fill:none;stroke:#e8a21a;stroke-width:1.3px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
#table .az{position:absolute;border:0;padding:0;margin:0;flex:none;display:block;font-size:clamp(7px,calc(var(--u)*1.9),11px);line-height:1.1}
#table .az .lb{position:absolute;left:var(--lx);top:var(--ly);transform:translate(-50%,-50%) rotate(var(--rot,0deg));text-align:center;width:max-content;max-width:96%;pointer-events:none}
.az .bet{left:var(--lx);top:calc(var(--ly) + 1.9em);right:auto;bottom:auto;transform:translate(-50%,-50%);z-index:3}
.az .pile{left:var(--lx);top:calc(var(--ly) + 1.9em);transform:translate(-50%,-50%);z-index:3}
#table .az.hot{background:#ffffff40;outline:0}
#table .az.blink{animation:bk .7s infinite alternate}
#table .sn{position:absolute;transform:translate(-50%,-50%);color:#fff;font:800 clamp(9px,calc(var(--u)*2.4),14px) system-ui,sans-serif;pointer-events:none;z-index:2}
#table .logo{position:absolute;left:50%;top:80%;font-size:10px;text-align:center;transform:translate(-50%,-50%);flex:none;z-index:1;white-space:nowrap}
#table .insbtn{position:absolute;top:92%;transform:translate(-50%,-50%);z-index:5;min-height:30px;padding:0 8px;font-size:clamp(9px,calc(var(--u)*2.2),12px)}
#table .insbtn.PLAYER{color:#ff7b7b}
#table .closeins{position:absolute;left:50%;top:92%;transform:translate(-50%,-50%);z-index:5;min-height:30px;padding:0 8px;font-size:clamp(9px,calc(var(--u)*2.2),12px)}
#bank button.bk{align-self:center;min-height:40px;padding:0 14px;font-size:13px}
#table #moreb{position:absolute;left:6px;top:6px;z-index:5;min-height:32px;padding:0 12px;font-size:clamp(10px,calc(var(--u)*2.4),13px)}
</style></head><body>
<div id="note"></div><div id="dbg"></div>
<div id="app">
 <div id="top"><span class="st" id="st">IDLE</span><span class="st" id="gn">Game #0</span>
  <button id="flow">Next Game</button><button id="lc" style="display:none"></button><button id="rmb" data-a="Remove Chip">Remove Chip</button>
  <button id="insb" style="display:none">Close Ins.</button>
  <button data-a="Settings">Settings</button><button id="rs">Reset</button></div>
 <div id="main">
  <div id="aye"><div id="shoe">ANGLE<br>AYE<br><span style="font-size:8px;color:#fff">chạm để kéo</span></div><div id="drawn"></div><div id="hist"></div></div>
  <div id="center">
   <div id="table"></div>
   
   <div id="work"><div id="cards"></div>
    <div id="tray"><div class="tt" id="trayT">Working area: 0</div><div id="trayChips"></div></div></div>
  </div>
 </div>
 <div id="bank"><button data-a="Pay Winning Bets" class="bk">Pay</button><button data-a="Collect Pair" class="bk">Collect Pair</button></div>
</div>
<div id="res"><div style="width:100%;text-align:center">Kết quả ván?</div><button data-r="BANKER">BANKER</button><button data-r="PLAYER">PLAYER</button><button data-r="TIE">TIE GAME</button><button id="rc">Hủy</button></div><div id="menu"></div><div id="toast"></div><div id="ghost"></div>
<div id="cardAct"><button id="oc">OPEN CARD</button><button id="pc">PASS CARD</button></div>
<script>
window.addEventListener('error',e=>{const d=document.getElementById('dbg');if(d){d.textContent='JS: '+e.message;d.style.display='block'}});
addEventListener('contextmenu',e=>e.preventDefault());
/* toạ độ màn hình -> toạ độ giao diện (khi đã tự xoay ở chế độ dọc) */
const rotated=()=>matchMedia('(orientation:portrait)').matches;
const Lp=(x,y)=>rotated()?{x:y,y:innerWidth-x}:{x,y};
const LR=r=>rotated()?{left:r.top,top:innerWidth-r.right,right:r.bottom,bottom:innerWidth-r.left}:r;
function note(t,ms){const n=document.getElementById('note');n.textContent=t;n.style.display='block';clearTimeout(note.t);note.t=setTimeout(()=>n.style.display='none',ms||1800)}
/* ===== config (chipConfig / betConfig) — tiền là số nguyên VND ===== */
const CHIPS=[[50000,'50K','#1f7a3a','#ffd54a'],[100000,'100K','#7fd68a','#063'],[500000,'500K','#0a4d22','#fff'],[1000000,'1M','#111','#fff'],
[5000000,'5M','#f08cb4','#400'],[10000000,'10M','#7a1226','#fff'],[50000000,'50M','#7b3fb0','#fff'],[100000000,'100M','#e0b020','#000'],[500000000,'500M','#e02020','#fff']];
const SIDE=[['BIG TIGER','50 to 1'],['SMALL TIGER','22 to 1'],['TIER TIE','35 to 1'],['TIE','8 to 1'],['PAIR PLAYER','11 to 1'],['PAIR BANKER','11 to 1'],
['SMALL DRAGON','15 to 1'],['BIG DRAGON','30 to 1'],['7/6 PLAYER','30/40/100'],['7/6 BANKER','30/40/100']];
const POS=['P 1st','P 2nd','B 1st','B 2nd','P 3rd','B 3rd'];
/* ===== chipEngine ===== */
const fmt=v=>v>=1e6?(v/1e6)+'M':(v/1e3)+'K';
const total=a=>a.reduce((s,d)=>s+d,0);
const chipOf=v=>CHIPS.find(c=>c[0]===v);
const sortInside=a=>[...a].sort((x,y)=>y-x); // chip lớn bên trong, nhỏ bên ngoài
/* ===== state ===== */
const S={work:[],bets:{},cards:Array(6).fill(null),drawn:null,gameNo:0,state:'IDLE'};
const $=id=>document.getElementById(id);
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',1800)}
function chipEl(v){const c=chipOf(v),d=document.createElement('div');d.className='chip';d.style.setProperty('--c',c[2]);d.style.setProperty('--t',c[3]);d.textContent=c[1];if(v==50000)d.style.borderColor='#ffd54a';return d}
/* ===== build table ===== */
const seats=document.createElement('div');
for(let i=1;i<=7;i++){const s=document.createElement('div');s.className='seat';s.innerHTML='<i>'+i+'</i>';
 [['p','PLAYER'],['b','BANKER']].forEach(([k,n])=>{s.appendChild(zone('main:'+i+':'+n,n,'zone '+k))});seats.appendChild(s)}
seats.firstChild;
function zone(id,label,cls,sub){const z=document.createElement('div');z.className=cls;z.dataset.zone=id;z.innerHTML=label+(sub?'<br><span style="font-weight:400">'+sub+'</span>':'');return z}
const sides=document.createElement('div');
{const col=document.createElement('div');col.style.cssText='display:grid;grid-template-columns:repeat(5,1fr);gap:3px;flex:4';
 SIDE.forEach(([n,p])=>col.appendChild(zone('side:'+n,n,'zone s',p)));sides.appendChild(col);
 const ic=document.createElement('div');ic.style.cssText='display:flex;flex-direction:column;gap:3px;flex:1';
 ['PLAYER','BANKER'].forEach(n=>ic.appendChild(zone('ins:'+n,n+' INSURANCE','zone ins')));sides.appendChild(ic)}
const cards=$('cards');
POS.forEach((n,i)=>{const s=document.createElement('div');s.className='slot';s.dataset.slot=i;s.textContent=(i>3?'':'')+'';cards.appendChild(s)});
/* order: P1 P2 B1 B2 / P3 B3 */
/* ===== chip bank: tap / hold ===== */
const bank=$('bank');
CHIPS.forEach(([v])=>{const w=document.createElement('div');w.appendChild(chipEl(v));w.append(fmt(v));bank.appendChild(w);let t,held,bad,sx,sy;
 const end=()=>clearTimeout(t);
 w.addEventListener('pointerdown',e=>{held=false;bad=false;sx=e.clientX;sy=e.clientY;end();t=setTimeout(()=>{held=true;showMenu(v,sx,sy)},450)});
 w.addEventListener('pointermove',e=>{if(!bad&&Math.hypot(e.clientX-sx,e.clientY-sy)>12){bad=true;end()}});
 w.addEventListener('pointercancel',()=>{bad=true;end()});
 w.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){bad=true;end()}});
 w.addEventListener('pointerup',()=>{end();if(!held&&!bad){S.work.push(v);renderWork()}})});
function showMenu(v,x,y){const m=$('menu');m.innerHTML='';
 [['Initial Cut (5)',5],['Full Stack (20)',20]].forEach(([l,n])=>{const b=document.createElement('button');b.textContent=l+' · '+fmt(v);
  b.onclick=()=>{for(let i=0;i<n;i++)S.work.push(v);renderWork();m.style.display='none'};m.appendChild(b)});
 const q=Lp(x,y);m.style.display='flex';m.style.left=Math.max(4,Math.min(q.x,document.body.clientWidth-150))+'px';m.style.bottom=(document.body.clientHeight-q.y+30)+'px'}

const done4=()=>stg()===4&&nextSlot()===null;           // 4 lá đã có kết quả luôn

const b3First=()=>{if(S.state!=='DEALING'||stg()!==4)return false;const p=pt(hand('P')),b=pt(hand('B'));return p>=6&&p<8&&b<=2};
{const a0=avail;avail=function(){return b3First()?null:a0()}}
/* side bet: điều kiện thắng + tỉ lệ (Dragon Tiger) */
function sideMul(n){const R=E.R,pl=hand('P').length,bl=hand('B').length,w=R.w,T={4:30,5:40,6:100};
 if(n==='TIE')return w==='TIE'?8:0;
 if(n==='PLAYER PAIR')return E.pp?11:0;if(n==='BANKER PAIR')return E.bp?11:0;
 if(n==='TIER TIE')return w==='TIE'&&R.p===6?35:0;
 if(n==='SMALL TIGER')return w==='BANKER'&&R.b===6&&bl===2?22:0;
 if(n==='BIG TIGER')return w==='BANKER'&&R.b===6&&bl===3?50:0;
 if(n==='SMALL DRAGON')return w==='PLAYER'&&R.p===7&&pl===2?15:0;
 if(n==='BIG DRAGON')return w==='PLAYER'&&R.p===7&&pl===3?30:0;
 if(n==='7/6'||n==='7/6 PLAYER')return w==='PLAYER'&&R.p===7&&R.b===6?(T[pl+bl]||0):0;
 if(n==='7/6 BANKER')return w==='BANKER'&&R.b===7&&R.p===6?(T[pl+bl]||0):0;
 return 0}
function status(id,R){if(id.startsWith('main'))return R.w==='TIE'?'push':id.split(':')[2]===R.w?'win':'lose';
 if(id.startsWith('ins:')){const m=E.insM[id.slice(4)];return m.kind==='TIE'?(R.w==='TIE'?'win':'lose'):(R.w!=='TIE'&&R.w!==m.side?'win':'lose')}
 return sideMul(side(id))>0?'win':'lose'}

 if(id.startsWith('ins:')){const m=E.insM[id.slice(4)];return m.amt*m.num/m.den}return t*sideMul(side(id))}

/* đổi tiền: nhiều dạng yêu cầu, khó hơn */
const rp=(v,n)=>Array(n).fill(v),asc=a=>[...a].sort((x,y)=>x-y),ckey=a=>asc(a).join(',');
function mkReq(){for(let t=0;t<30;t++){
  if(rnd(100)<45){const big=[5e6,1e7,5e7,1e8,5e8][rnd(5)],a=rp(big,1+rnd(2)),T=total(a);
   const xs=CHIPS.map(c=>c[0]).filter(d=>d<big&&T/d>=4&&T/d<=100);
   if(xs.length){const X=xs[rnd(xs.length)],mx=Math.min(T/X,40),N=Math.max(2,Math.floor(mx*(0.3+rnd(50)/100)));
    a.kind='atleast';a.need=X;a.min=N;a.txt='Khách yêu cầu: có ít nhất '+N+'×'+fmt(X)+' (phần còn lại tuỳ ý)';return a}}
  const r=rnd(100);let a;
  if(r<25)a=rp([5e6,1e7,5e7,1e8,5e8][rnd(5)],1+rnd(4));
  else if(r<50)a=rp([5e4,1e5,5e5,1e6][rnd(4)],10+rnd(15));
  else{a=[];const st=new Set();for(let k=2+rnd(3);st.size<k;)st.add(CHIPS[rnd(CHIPS.length-1)][0]);st.forEach(v=>a.push(...rp(v,1+rnd(5))));a=asc(a)}
  const T=total(a),ds=new Set(a);if(!CHIPS.some(([d])=>!ds.has(d)&&d<=T))continue;
  const k=rnd(100);
  if(k<20){const c=CHIPS.map(x=>x[0]).filter(d=>!ds.has(d)&&d<=T&&T%d===0&&T/d<=40);if(c.length){a.kind='target';a.need=c[rnd(c.length)];a.txt='Khách yêu cầu: đổi toàn bộ sang chip '+fmt(a.need);return a}}
  else if(k<32){const n=chipsFor(T);if(ckey(n)!==ckey(a)){a.kind='compact';a.need=n;a.txt='Khách yêu cầu: đổi gọn nhất (ít chip nhất)';return a}}
  else if(k<48){const cs=[];CHIPS.forEach(([x])=>CHIPS.forEach(([y])=>{if(x<y)for(let ny=1;ny<=20;ny++){const rest=T-ny*y;if(rest>0&&rest%x===0&&rest/x<=20)cs.push([x,rest/x,y,ny])}}));
   if(cs.length){const [x,nx,y,ny]=cs[rnd(cs.length)],need=[...rp(x,nx),...rp(y,ny)];if(ckey(need)!==ckey(a)){a.kind='mix';a.need=need;a.txt='Khách yêu cầu: '+ny+'×'+fmt(y)+' + '+nx+'×'+fmt(x);return a}}}
  return a}
 return rp(5e6,2)}
